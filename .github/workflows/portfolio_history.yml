
name: ENSIM Portfolio History

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: ensim-portfolio-history
  cancel-in-progress: false

jobs:
  update-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: python -m pip install requests

      - name: Collect portfolio values
        run: python scripts/compare_traders.py

      - name: Publish history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/portfolio_comparison.json
          git add docs/data/portfolio_history.json

          if git diff --cached --quiet; then
            echo "No new data to publish."
          else
            git commit -m "Update ENSIM portfolio snapshots"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
