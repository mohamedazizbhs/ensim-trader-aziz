
name: ENSIM Portfolio History

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: ensim-portfolio-history
  cancel-in-progress: false

jobs:
  update-history:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Update portfolio comparison
        run: python scripts/compare_traders.py

      - name: Publish historical data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/portfolio_comparison.json
          git add docs/data/portfolio_history.json

          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update ENSIM portfolio history"
            git push
          fi
