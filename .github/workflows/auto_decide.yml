
name: ENSIM Trading - Safe Simulation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run secured trading simulation
        run: python scripts/algorithm.py

    
      - name: Save simulation results and decision log
        uses: actions/upload-artifact@v4
        with:
          name: ensim-simulation
          path: |
            simulation_decision.json
            output/decision_log.jsonl
          if-no-files-found: error

